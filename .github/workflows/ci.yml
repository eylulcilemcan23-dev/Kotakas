name: KOTAKAS CI

on:
  pull_request:
  push:
    branches:
      - source-migration

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Role tests
        run: npm test
      - name: Source smoke test
        run: bash scripts/smoke.sh
