name: KOTAKAS CSharp CI

on:
  push:
    branches: [csharp-rebuild]
    paths:
      - 'csharp/**'
      - '.github/workflows/csharp-ci.yml'
  pull_request:
    paths:
      - 'csharp/**'
      - '.github/workflows/csharp-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: JavaScript syntax
        run: |
          for f in csharp/Kotakas.Web/wwwroot/js/app.js csharp/Kotakas.Web/wwwroot/js/chunks/*.js; do
            node --check "$f"
          done
      - name: Restore web
        run: dotnet restore csharp/Kotakas.Web/Kotakas.Web.csproj
      - name: Restore migrator
        run: dotnet restore csharp/Kotakas.Migrator/Kotakas.Migrator.csproj
      - name: Build web
        run: dotnet build csharp/Kotakas.Web/Kotakas.Web.csproj -c Release --no-restore
      - name: Build migrator
        run: dotnet build csharp/Kotakas.Migrator/Kotakas.Migrator.csproj -c Release --no-restore
      - name: Publish web
        run: dotnet publish csharp/Kotakas.Web/Kotakas.Web.csproj -c Release --no-build -o out/kotakas
      - name: Publish migrator
        run: dotnet publish csharp/Kotakas.Migrator/Kotakas.Migrator.csproj -c Release --no-build -o out/migrator
      - name: Build source package
        run: |
          mkdir -p out/package
          zip -qr out/package/KOTAKAS_CSHARP_V12_SOURCE.zip csharp
      - name: Upload hosting publish
        uses: actions/upload-artifact@v4
        with:
          name: KOTAKAS_CSHARP_V12_HOSTING
          path: out/kotakas
          if-no-files-found: error
      - name: Upload PostgreSQL migrator
        uses: actions/upload-artifact@v4
        with:
          name: KOTAKAS_CSHARP_V12_MIGRATOR
          path: out/migrator
          if-no-files-found: error
      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: KOTAKAS_CSHARP_V12_SOURCE
          path: out/package/KOTAKAS_CSHARP_V12_SOURCE.zip
          if-no-files-found: error

  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kotakas_target
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d kotakas_target"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore and build
        run: |
          dotnet restore csharp/Kotakas.Migrator/Kotakas.Migrator.csproj
          dotnet build csharp/Kotakas.Migrator/Kotakas.Migrator.csproj -c Release --no-restore
      - name: Create real SQLite user
        run: |
          rm -f /tmp/kotakas-ci.db
          Database__Provider=sqlite \
          ConnectionStrings__Default='Data Source=/tmp/kotakas-ci.db' \
          ASPNETCORE_URLS=http://127.0.0.1:5091 \
          dotnet run --project csharp/Kotakas.Web/Kotakas.Web.csproj -c Release --no-build >/tmp/kotakas-sqlite.log 2>&1 &
          echo $! >/tmp/kotakas-sqlite.pid
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5091/api/health && break || sleep 1; done
          curl -fsS -H 'X-KOTAKAS-CSRF: 1' -H 'Content-Type: application/json' \
            -d '{"displayName":"CI Migration User","email":"migration-ci@kotakas.local","password":"Testpass123"}' \
            http://127.0.0.1:5091/api/register | tee /tmp/register.json
          grep -q 'migration-ci@kotakas.local' /tmp/register.json
          kill $(cat /tmp/kotakas-sqlite.pid)
          wait $(cat /tmp/kotakas-sqlite.pid) 2>/dev/null || true
      - name: Migrate SQLite to PostgreSQL
        run: |
          dotnet run --project csharp/Kotakas.Migrator/Kotakas.Migrator.csproj -c Release --no-build -- \
            --sqlite 'Data Source=/tmp/kotakas-ci.db' \
            --postgres 'Host=127.0.0.1;Port=5432;Database=kotakas_target;Username=postgres;Password=postgres' \
            --execute | tee /tmp/migration.log
          grep -q 'DB TAŞIMA BAŞARILI' /tmp/migration.log
      - name: Boot PostgreSQL and verify same password
        run: |
          Database__Provider=postgres \
          ConnectionStrings__Postgres='Host=127.0.0.1;Port=5432;Database=kotakas_target;Username=postgres;Password=postgres' \
          ASPNETCORE_URLS=http://127.0.0.1:5092 \
          dotnet run --project csharp/Kotakas.Web/Kotakas.Web.csproj -c Release --no-build >/tmp/kotakas-postgres.log 2>&1 &
          echo $! >/tmp/kotakas-postgres.pid
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5092/api/health >/tmp/health.json && break || sleep 1; done
          cat /tmp/health.json
          grep -q 'PostgreSQL' /tmp/health.json
          curl -fsS -H 'X-KOTAKAS-CSRF: 1' -H 'Content-Type: application/json' \
            -d '{"email":"migration-ci@kotakas.local","password":"Testpass123"}' \
            http://127.0.0.1:5092/api/login | tee /tmp/login.json
          grep -q 'migration-ci@kotakas.local' /tmp/login.json
          kill $(cat /tmp/kotakas-postgres.pid)
          wait $(cat /tmp/kotakas-postgres.pid) 2>/dev/null || true
      - name: Dump logs on failure
        if: failure()
        run: |
          echo '--- SQLite log ---'; cat /tmp/kotakas-sqlite.log 2>/dev/null || true
          echo '--- Migration log ---'; cat /tmp/migration.log 2>/dev/null || true
          echo '--- PostgreSQL log ---'; cat /tmp/kotakas-postgres.log 2>/dev/null || true
